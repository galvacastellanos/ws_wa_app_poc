AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets for ws_wa_app_poc

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - prd

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'ws-wa-app-poc-v1-${EnvironmentName}-db'
      Description: !Sub 'Database configuration for ws_wa_app_poc ${EnvironmentName}'
      SecretString: '{"ConnectionStrings__Default":"REPLACE_WITH_REAL_CONNECTION_STRING"}'
      Tags:
        - Key: Application
          Value: ws_wa_app_poc
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  DatabaseSecretArn:
    Description: ARN of the database secret
    Value: !Ref DatabaseSecret
