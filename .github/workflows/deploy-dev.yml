name: Deploy ws_wa_app_poc to DEV

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'infrastructure/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  
jobs:
  deploy-dev:
    name: Build and deploy to DEV
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN_DEV }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER_DEV }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_DEV }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY_DEV }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME_DEV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsDEV

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail

          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition-current.json

      - name: Update container image in task definition
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          TARGET_CONTAINER=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
            if (.containerDefinitions | length) == 0 then
              error("Task definition has no containerDefinitions")
            elif any(.containerDefinitions[]; .name == $container) then
              $container
            else
              .containerDefinitions[0].name
            end
          ' task-definition-current.json)

          echo "Configured container: $ECS_CONTAINER_NAME"
          echo "Using container: $TARGET_CONTAINER"

          jq \
            --arg image "$IMAGE_URI" \
            --arg container "$TARGET_CONTAINER" \
            '
              .containerDefinitions |= map(
                if .name == $container
                then .image = $image
                else .
                end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt
                )
            ' task-definition-current.json > task-definition-new.json

      - name: Register new task definition
        id: register-task
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
 
      - name: Deploy to ECS
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.arn }}"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deployment completed
        run: echo "DEV deployment completed successfully."
